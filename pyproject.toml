[project]
name = "role-probe-training"
version = "0.1.0"
description = "Experiments on training models against role probes"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# One environment for generation, evaluation, scoring and training. Shared packages take the
# constraint of Xiaoxue's prompt_injection_interp project (see AGENTS.md). inspect-ai and openai
# are pinned to the versions the recorded Inspect cohorts used.
dependencies = [
    "accelerate>=1.12.0,<2",
    "agentdojo==0.1.35",
    "datasets>=4.4.1,<5",
    "huggingface-hub>=0.36.0,<2",
    "inspect-ai==0.3.283",
    "inspect-evals[swe-bench]==0.25.0",
    "matplotlib>=3.10.7,<4",
    "numpy>=2.2.0,<3",
    "openai==3.36.0",
    "oss-harmony==0.0.12",
    "peft==0.18.1",
    "rapidfuzz>=3,<4",
    "scikit-learn>=1.8.0,<2",
    "scipy>=1.14,<2",
    "swebench==4.1.0",
    "torch>=2.9.1,<3",
    "transformers==5.9.0",
    "wandb>=0.23.1,<1",
    "zstandard>=0.25.0",
]

# vLLM is an extra, as in prompt_injection_interp, so that nodes which only train or score do
# not pull its compiled kernels. It pins torch (2.13.0) for the whole lock.
#   uv sync --locked --extra vllm    # nodes that serve the model
#   uv sync --locked                 # everywhere else
# cuML cannot share this environment (vLLM needs numba 0.65.0, cuML needs numba < 0.65): probe
# fitting runs from src/experiments/gptoss_role_probes/fit_env. AppWorld's own package needs
# pydantic 1 and keeps src/experiments/eval_role_probes/agentic_eval/appworld/env.
[project.optional-dependencies]
vllm = [
    "ninja>=1.13.2",
    "nvidia-cuda-cccl==13.0.85",
    "nvidia-cuda-nvcc==13.0.88",
    "nvidia-nvvm==13.0.88",
    "vllm==0.27.1",
]

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/role_probe_training"]

[tool.uv]
cache-dir = ".uv-cache"
# vLLM requires upstream openai-harmony. The pinned fork oss-harmony installs the same
# `openai_harmony` module, so the upstream copy is excluded and only the fork is installed.
exclude-dependencies = ["openai-harmony"]
# inspect-ai 0.3.283 imports acp.helpers, which agent-client-protocol 1.0 removed, but only
# requires >=0.12.0. Inspect's other dependencies stay at the recorded client versions through uv.lock.
constraint-dependencies = ["agent-client-protocol<1"]
